<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" height="170" fill="none">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .bar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .title-text { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.5px; }
      .header-name { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
      .header-sub { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13.5px; font-weight: 400; }
      .header-accent { fill: #00f0ff; }
      .code-font { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
      .badge-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4; }
      .status-dot { fill: #00f0ff; }
    </style>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#8b949e" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="798" height="168" rx="8" class="bg" />

  <!-- Background grid -->
  <rect x="2" y="36" width="796" height="132" fill="url(#grid-dark)" />

  <!-- Top bar -->
  <path d="M 1 9 C 1 4.58 4.58 1 9 1 L 791 1 C 795.42 1 799 4.58 799 9 L 799 36 L 1 36 Z" class="bar" />
  
  <!-- Terminal window dots -->
  <circle cx="18" cy="18" r="4.5" fill="#ff5f56" opacity="0.75" />
  <circle cx="34" cy="18" r="4.5" fill="#ffbd2e" opacity="0.75" />
  <circle cx="50" cy="18" r="4.5" fill="#27c93f" opacity="0.75" />

  <!-- Terminal title -->
  <text x="72" y="22" class="title-text code-font">numberw8835 // systems-core</text>

  <!-- Right status pill in top bar -->
  <g transform="translate(640, 9)">
    <rect width="145" height="19" rx="3" class="badge-bg" />
    <circle cx="12" cy="9.5" r="3.5" class="status-dot" />
    <text x="22" y="13.5" class="title-text code-font" style="font-size: 10px;">status: shipping</text>
  </g>

  <!-- Main identity -->
  <text x="36" y="86" class="header-name">
    numberw8835<tspan class="header-accent code-font" style="font-weight: 400;">_</tspan>
  </text>
  
  <text x="36" y="114" class="header-sub">
    Computer Science &amp; Engineering <tspan style="opacity: 0.5;">·</tspan> Systems <tspan style="opacity: 0.5;">·</tspan> Firmware &amp; Embedded <tspan style="opacity: 0.5;">·</tspan> Automation
  </text>

  <!-- Prompt line -->
  <g transform="translate(36, 134)">
    <text x="0" y="12" class="code-font" style="font-size: 11px; fill: #8b949e;">
      <tspan class="header-accent code-font">&gt;</tspan> building systems that waste nothing <tspan style="opacity: 0.4;">|</tspan> minimizing action, one commit at a time
    </text>
  </g>
</svg>
